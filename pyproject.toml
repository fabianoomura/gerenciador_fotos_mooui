[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visual-photo-catalog"
version = "0.1.0"
description = "Catálogo local para pesquisa textual, semântica, visual e por cores."
requires-python = ">=3.11"
authors = [{ name = "Fabiano Omura" }]
dependencies = [
    "unidecode>=1.3.8",
]

[project.optional-dependencies]
visual = [
    "pillow>=10.3",
    "numpy>=1.26",
    "sentence-transformers==5.6.0",
    "sqlite-vec>=0.1.9,<0.2",
]
# Etapa 3+ (indexador com CLIP/paleta/Prefect); ficam em WSL, so instalar quando chegar
# la — evita puxar torch no dev do parser.
indexer = [
    "pillow>=10.3",
    "numpy>=1.26",
    "scikit-learn>=1.4",              # k-means da paleta
    "sentence-transformers>=2.7",     # CLIP multilingual
    "sqlite-vec>=0.1.6",
    "prefect>=3.0",
]
api = [
    "fastapi==0.139.0",
    "uvicorn[standard]>=0.30",
    "httpx>=0.28,<1",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/catalogo"]

[tool.hatch.build.targets.wheel.force-include]
"src/catalogo/schema.sql" = "catalogo/schema.sql"
"src/catalogo/seeds.sql" = "catalogo/seeds.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/catalogo/api.py" = ["B008"] # FastAPI usa Query nos defaults para declarar parâmetros.
